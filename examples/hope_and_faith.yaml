- section: '1. Hope waits for the unseen'
  section_subtitle: காணாதவைகளை நம்புதல் — Romans 8:24–25
  verses:
  - reference: Romans 8:24–25 (NKJV)
    split_max_length: 500
    text: >-
      For we were saved in this hope, but hope that is seen is not hope; for why
      does one still hope for what he sees? But if we hope for what we do not see,
      we eagerly wait for it with perseverance.
    highlights:
    - hope that is seen is not hope
    - hope for what we do not see
    - eagerly wait for it with perseverance
  - reference: Ephesians 1:18–19 (NKJV)
    split_max_length: 500
    text: >-
      the eyes of your understanding being enlightened; that you may know what is
      the hope of His calling, what are the riches of the glory of His inheritance
      in the saints, and what is the exceeding greatness of His power toward us who
      believe, according to the working of His mighty power
    highlights:
    - eyes of your understanding being enlightened
    - hope of His calling
    - exceeding greatness of His power
- section: '2. Faith is substance — not sight'
  section_subtitle: விசுவாசம் காணாதவைகளுக்கு நிரூபணம் — Hebrews 11:1–3
  verses:
  - reference: Hebrews 11:1–3 (NKJV)
    split_max_length: 500
    text: >-
      Now faith is the substance of things hoped for, the evidence of things not
      seen. For by it the elders obtained a good testimony. By faith we understand
      that the worlds were framed by the word of God, so that the things which are
      seen were not made of things which are visible.
    highlights:
    - substance of things hoped for
    - evidence of things not seen
    - worlds were framed by the word of God
  - reference: Romans 10:10 (NKJV)
    text: >-
      For with the heart one believes unto righteousness, and with the mouth
      confession is made unto salvation.
    highlights:
    - with the heart one believes
    - with the mouth confession is made
  - reference: 1 Peter 1:8–9 (NKJV)
    split_max_length: 500
    text: >-
      whom having not seen you love. Though now you do not see Him, yet believing,
      you rejoice with joy inexpressible and full of glory, receiving the end of
      your faith—the salvation of your souls.
    highlights:
    - having not seen you love
    - yet believing, you rejoice
    - end of your faith
- section: "3. Jacob's rods — look at the unseen picture"
  section_subtitle: யாகோபின் குச்சிகள் — Genesis 30:37–39, 43
  verses:
  - reference: Genesis 30:37–39 (NKJV)
    split_max_length: 500
    text: >-
      Now Jacob took for himself rods of green poplar and almond and chestnut, and
      peeled white strips in them, and exposed the white which was in the rods. And
      the rods which he had peeled, he set before the flocks in the gutters, in the
      watering troughs where the flocks came to drink, so that they should conceive
      when they came to drink. So the flocks conceived before the rods, and the
      flocks brought forth streaked, speckled, and spotted.
    highlights:
    - peeled white strips
    - set before the flocks
    - streaked, speckled, and spotted
  - reference: Genesis 30:43 (NKJV)
    text: >-
      Thus the man became exceedingly prosperous, and had large flocks, female and
      male servants, and camels and donkeys.
    highlights:
    - exceedingly prosperous
    - large flocks
  - reference: Genesis 31:9–12 (NKJV)
    split_max_length: 500
    text: >-
      So God has taken away the livestock of your father and given them to me. "And
      it happened, at the time when the flocks conceived, that I lifted my eyes and
      saw in a dream, and behold, the rams which leaped upon the flocks were
      streaked, speckled, and gray-spotted. Then the Angel of God spoke to me in a
      dream, saying, 'Jacob.' And I said, 'Here I am.' And He said, 'Lift your eyes
      now and see, all the rams which leap on the flocks are streaked, speckled,
      and gray-spotted; for I have seen all that Laban is doing to you."
    highlights:
    - saw in a dream
    - streaked, speckled, and gray-spotted
    - I have seen all that Laban is doing to you
- section: '4. Bronze serpent — look and live'
  section_subtitle: வெண்கல சர்ப்பம் — Numbers 21:8–9, John 3:14–16
  verses:
  - reference: Numbers 21:8–9 (NKJV)
    split_max_length: 500
    text: >-
      Then the LORD said to Moses, "Make a fiery serpent, and set it on a pole; and
      it shall be that everyone who is bitten, when he looks at it, shall live." So
      Moses made a bronze serpent, and put it on a pole; and so it was, if a serpent
      had bitten anyone, when he looked at the bronze serpent, he lived.
    highlights:
    - when he looks at it, shall live
    - bronze serpent
    - he lived
  - reference: John 3:14–16 (NKJV)
    split_max_length: 500
    text: >-
      And as Moses lifted up the serpent in the wilderness, even so must the Son of
      Man be lifted up, that whoever believes in Him should not perish but have
      eternal life. For God so loved the world that He gave His only begotten Son,
      that whoever believes in Him should not perish but have everlasting life.
    highlights:
    - Son of Man be lifted up
    - whoever believes in Him
    - God so loved the world
