    - God of the armies of Israel
  - reference: Daniel 10:11 (NKJV)
    split_max_length: 500
    text: >-
      And he said to me, "O Daniel, man greatly beloved, understand the words
      that I speak to you, and stand upright, for I have now been sent to you."
      While he was speaking this word to me, I stood trembling.
    highlights:
