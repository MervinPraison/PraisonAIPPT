sections:
- section: '1. You — beloved (Matthew 6)'
  section_subtitle: Do not worry — more precious than birds and lilies
  verses:
  - reference: Matthew 6:25–26 (NKJV)
    split_max_length: 500
    text: >-
      Therefore I say to you, do not worry about your life, what you will eat or
      what you will drink; nor about your body, what you will put on. Is not life
      more than food and the body more than clothing? Look at the birds of the
      air, for they neither sow nor reap nor gather into barns; yet your heavenly
      Father feeds them. Are you not of more value than they?
    highlights:
    - do not worry about your life
    - your heavenly Father feeds them
    - more value than they
  - reference: Matthew 6:27–28 (NKJV)
    text: >-
      Which of you by worrying can add one cubit to his stature? So why do you
      worry about clothing? Consider the lilies of the field, how they grow: they
      neither toil nor spin;
    highlights:
    - by worrying can add one cubit
    - neither toil nor spin
  - reference: Matthew 6:29–30 (NKJV)
    split_max_length: 500
    text: >-
      and yet I say to you that even Solomon in all his glory was not arrayed
      like one of these. Now if God so clothes the grass of the field, which
      today is, and tomorrow is thrown into the oven, will He not much more
      clothe you, O you of little faith?
    highlights:
    - Solomon in all his glory
    - O you of little faith
  - reference: Matthew 6:31–32 (NKJV)
    text: >-
      Therefore do not worry, saying, "What shall we eat?" or "What shall we
      drink?" or "What shall we wear?" For after all these things the Gentiles
      seek. For your heavenly Father knows that you need all these things.
    highlights:
    - do not worry
    - your heavenly Father knows
  - reference: Romans 8:32 (NKJV)
    split_max_length: 500
    text: >-
      He who did not spare His own Son, but delivered Him up for us all, how
      shall He not with Him also freely give us all things?
    highlights:
    - did not spare His own Son
    - freely give us all things
