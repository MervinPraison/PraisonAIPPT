- section: '1. Zerubbabel — grace completes the work'
  section_subtitle: Grace, grace to it — Zechariah 4:7
  verses:
  - reference: Zechariah 4:7 (NKJV)
    text: >-
      Who are you, O great mountain? Before Zerubbabel you shall become a plain!
      And he shall bring forth the capstone With shouts of "Grace, grace to it!"
    highlights:
    - O great mountain
    - become a plain
    - Grace, grace to it
- section: '2. Elijah — remnant chosen by grace'
  section_subtitle: Romans 11:4–6
  verses:
  - reference: Romans 11:4–6 (NKJV)
    split_max_length: 500
    text: >-
      But what does the divine response say to him? "I have reserved for Myself
      seven thousand men who have not bowed the knee to Baal." Even so then, at
      this present time there is a remnant according to the election of grace.
      And if by grace, then it is no longer of works; otherwise grace is no
      longer grace. But if it is of works, it is no longer grace; otherwise work
      is no longer work.
    highlights:
    - seven thousand men
    - remnant according to the election of grace
    - no longer of works
- section: '3. Abraham — grace calls life from the dead'
  section_subtitle: Genesis 17:5 · Romans 4:19
  verses:
  - reference: Genesis 17:5 (NKJV)
    text: >-
      No longer shall your name be called Abram, but your name shall be Abraham;
      for I have made you a father of many nations.
    highlights:
    - father of many nations
  - reference: Romans 4:19 (NKJV)
    split_max_length: 500
    text: >-
      And not being weak in faith, he did not consider his own body, already dead
      (since he was about a hundred years old), and the deadness of Sarah's womb.
    highlights:
    - not being weak in faith
    - did not consider his own body, already dead
    - deadness of Sarah's womb
- section: '4. Grace through Jesus Christ'
  section_subtitle: John 1:17 · Romans 6:14
  verses:
  - reference: John 1:17 (NKJV)
    text: >-
