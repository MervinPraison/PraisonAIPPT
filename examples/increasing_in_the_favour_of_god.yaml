sections:
- section: '1. Favour in Scripture'
  section_subtitle: வேதாகமத்தில் கிருபை — Noah, Abraham, Esther
  verses:
  - reference: Genesis 6:8–9 (NKJV)
    split_max_length: 500
    text: >-
      But Noah found grace in the eyes of the Lord… Noah was a just man, perfect
      in his generations. Noah walked with God.
    highlights:
    - found grace in the eyes of the Lord
    - walked with God
  - reference: Genesis 5:29 (NKJV)
    text: >-
      And he called his name Noah, saying, "This one will comfort us concerning
      our work and the toil of our hands, because of the ground which the Lord
      has cursed."
    highlights:
    - comfort us
    - toil of our hands
  - reference: Luke 2:40 (NKJV)
    text: >-
      And the Child grew and became strong in spirit, filled with wisdom; and
      the grace of God was upon Him.
    highlights:
    - grace of God was upon Him
  - reference: Luke 2:52 (NKJV)
    text: >-
      And Jesus increased in wisdom and stature, and in favor with God and men.
    highlights:
    - increased in wisdom and stature
    - favor with God and men
- section: '2. Moses asks for favour and rest'
  section_subtitle: மோசே — கிருபையும் இளைப்பாருதலும்
  verses:
  - reference: Exodus 33:13–14 (NKJV)
    split_max_length: 500
    text: >-
      Now therefore, I pray, if I have found grace in Your sight, show me now
      Your way, that I may know You and that I may find grace in Your sight. And
      consider that this nation is Your people." And He said, "My Presence will
      go with you, and I will give you rest."
    highlights:
    - found grace in Your sight
    - I will give you rest
  - reference: Exodus 33:16–17 (NKJV)
    split_max_length: 500
    text: >-
      For how then will it be known that Your people and I have found grace in
      Your sight, except You go with us?… So the Lord said to Moses, "I will
      also do this thing that you have spoken; for you have found grace in My
      sight, and I know you by name."
    highlights:
    - found grace in My sight
    - I know you by name
- section: '3. Enter His rest — first way'
  section_subtitle: 'முதல் வழி: இளைப்பாருதல்'
  verses:
  - reference: Hebrews 4:9–11 (NKJV)
    split_max_length: 500
    text: >-
      There remains therefore a rest for the people of God. For he who has
      entered His rest has himself also ceased from his works as God did from
      His. Let us therefore be diligent to enter that rest, lest anyone fall
      according to the same example of disobedience.
    highlights:
    - a rest for the people of God
    - ceased from his works
  - reference: Hebrews 3:18–19 (NKJV)
    text: >-
      And to whom did He swear that they would not enter His rest, but to those
      who did not obey? So we see that they could not enter in because of
      unbelief.
    highlights:
    - could not enter in because of unbelief
  - reference: Hebrews 4:2–3 (NKJV)
    split_max_length: 500
    text: >-
      For indeed the gospel was preached to us as well as to them; but the word
      which they heard did not profit them, not being mixed with faith in those
      who heard it. For we who have believed do enter that rest, as He has
      said…
    highlights:
    - not being mixed with faith
    - we who have believed do enter that rest
  - reference: Hebrews 4:8 (NKJV)
    text: >-
      For if Joshua had given them rest, then He would not afterward have spoken
      of another day.
    highlights:
    - spoken of another day
  - reference: Hebrews 4:10 (NKJV)
    text: >-
      For he who has entered His rest has himself also ceased from his works as
      God did from His.
    highlights:
    - entered His rest
    - ceased from his works
  - reference: Hebrews 4:16 (NKJV)
    text: >-
      Let us therefore come boldly to the throne of grace, that we may obtain
      mercy and find grace to help in time of need.
    highlights:
    - throne of grace
    - find grace to help
  - reference: Matthew 11:28–30 (NKJV)
    split_max_length: 500
    text: >-
      Come to Me, all you who labor and are heavy laden, and I will give you
      rest. Take My yoke upon you and learn from Me, for I am gentle and lowly
      in heart, and you will find rest for your souls. For My yoke is easy and
      My burden is light."
    highlights:
    - I will give you rest
    - rest for your souls
- section: '4. Faith — second way'
  section_subtitle: 'இரண்டாம் வழி: விசுவாசம்'
  verses:
  - reference: Romans 5:1–2 (NKJV)
    split_max_length: 500
    text: >-
      Therefore, having been justified by faith, we have peace with God through
      our Lord Jesus Christ, through whom also we have access by faith into this
      grace in which we stand, and rejoice in hope of the glory of God.
    highlights:
    - access by faith into this grace
    - in which we stand
  - reference: Hebrews 4:2–3 (NKJV)
    split_max_length: 500
    text: >-
      For indeed the gospel was preached to us as well as to them; but the word
      which they heard did not profit them, not being mixed with faith in those
      who heard it. For we who have believed do enter that rest…
    highlights:
    - mixed with faith
    - enter that rest
- section: '5. Speak the cross — third way'
  section_subtitle: 'மூன்றாம் வழி: சிலுவையைப் பேசுதல்'
  verses:
  - reference: Romans 10:8–10 (NKJV)
    split_max_length: 500
    text: >-
      But what does it say? "The word is near you, in your mouth and in your
      heart" (that is, the word of faith which we preach): that if you confess
      with your mouth the Lord Jesus and believe in your heart that God has
      raised Him from the dead, you will be saved.
    highlights:
    - confess with your mouth
    - believe in your heart
  - reference: 2 Corinthians 4:13 (NKJV)
    text: >-
      And since we have the same spirit of faith, according to what is written,
      "I believed and therefore I spoke," we also believe and therefore speak.
    highlights:
    - spirit of faith
    - I believed and therefore I spoke
- section: '6. Hear the cross — fourth way'
  section_subtitle: 'நான்காம் வழி: சிலுவையைக் கேட்பது'
  verses:
  - reference: Romans 10:17 (NKJV)
    text: >-
      So then faith comes by hearing, and hearing by the word of God.
    highlights:
    - faith comes by hearing
    - word of God
  - reference: Galatians 3:1–5 (NKJV)
    split_max_length: 500
    text: >-
      O foolish Galatians! Who has bewitched you that you should not obey the
      truth, before whose eyes Jesus Christ was clearly portrayed among you as
      crucified? This only I want to learn from you: Did you receive the Spirit
      by the works of the law, or by the hearing of faith?… He who supplies the
      Spirit to you and works miracles among you, does He do it by the works of
      the law, or by the hearing of faith?
    highlights:
    - portrayed among you as crucified
    - hearing of faith
    - works miracles among you
  - reference: 1 Corinthians 2:2 (NKJV)
    text: >-
      For I determined not to know anything among you except Jesus Christ and
      Him crucified.
    highlights:
    - Jesus Christ and Him crucified
  - reference: 1 Corinthians 1:23–24 (NKJV)
    split_max_length: 500
    text: >-
      but we preach Christ crucified, to the Jews a stumbling block and to the
      Greeks foolishness, but to those who are called, both Jews and Greeks,
      Christ the power of God and the wisdom of God.
    highlights:
    - preach Christ crucified
    - power of God and the wisdom of God
- section: '7. Grace and truth through Jesus'
  section_subtitle: ஏசுவினாலே கிருபையும் சத்தியமும்
  verses:
  - reference: John 1:16–17 (NKJV)
    split_max_length: 500
    text: >-
      And of His fullness we have all received, and grace for grace. For the
      law was given through Moses, but grace and truth came through Jesus
      Christ.
    highlights:
    - grace for grace
    - grace and truth came through Jesus Christ
