# From new_recording_382 sermon — NKJV. Favour increases through Rest → Faith → Speaking → Hearing → Jesus is rest.
presentation_title: Increasing in the Favour of God
presentation_subtitle: தேவனுடைய கிருபையில் அதிகரித்தல் — John 1:16–17
