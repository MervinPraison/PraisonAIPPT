# English + Tamil build of he_will_not_put_to_shame.yaml (Twin cards, Tamil first).
#
# Sections come straight from the English deck (sections_from), so an edit there
# reaches this deck too. Tamil verse text is looked up from the local Tamil O.V.
# Bible (TAOVBSI, ~/.praisonai/lyrical-video/tamil-ov.json or $PRAISONAI_TAMIL_BIBLE)
# unless a verse sets text_ta. Tamil highlights and headings (highlights_ta,
# reference_ta, section_ta, leading_title_ta) live next to the English in that deck.
#
#   python3 -m praisonaippt.cli -i examples/he_will_not_put_to_shame_ta.yaml \
#     -o examples/he_will_not_put_to_shame_ta.pptx
#   # portable copy with the Tamil written in (no Bible file needed to build it):
#   python3 -m praisonaippt.cli bilingual-fill examples/he_will_not_put_to_shame_ta.yaml -o deck_filled.yaml
presentation_title: He will not put to shame / அவன் வெட்கப்படுவதில்லை
presentation_subtitle: NKJV · NIV · TAOVBSI
auto_upload_gdrive: true
bilingual:
  language: ta
  version: TAOVBSI
  strict: true
slide_style:
  background_image: assets/background_alt.jpg
  text_color: white
  alignment: left
  reference_position: top
  font_name: Noto Serif
  tamil_font_name: Noto Serif Tamil
  bilingual_layout: cards
  bilingual_primary: tamil
sections_from: he_will_not_put_to_shame.yaml
