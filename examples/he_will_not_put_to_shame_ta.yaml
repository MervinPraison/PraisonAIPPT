- section: 1. Sent
  section_subtitle: How shall they preach unless they are sent
  verses:
  - reference: Romans 10:15 (NKJV)
    split_max_length: 500
    text: 'And how shall they preach unless they are sent? As it is written: "How beautiful are the feet of those who preach the gospel of peace, Who bring glad tidings of good things!"'
    highlights:
    - sent
    reference_ta: ரோமர் 10:15 (TAOVBSI)
    text_ta: அனுப்பப்படாவிட்டால் எப்படிப் பிரசங்கிப்பார்கள்? சமாதானத்தைக்கூறி, நற்காரியங்களைச் சுவிசேஷமாய் அறிவிக்கிறவர்களுடைய பாதங்கள் எவ்வளவு அழகானவைகள் என்று எழுதியிருக்கிறதே.
    highlights_ta:
    - அனுப்பப்படாவிட்டால்
  - reference: Malachi 3:8 (NKJV)
    leading_title: Tithes and Offerings
    split_max_length: 500
    text: '"Will a man rob God? Yet you have robbed Me! But you say, ''In what way have we robbed You?'' In tithes and offerings."'
    highlights:
    - tithes and offerings
    reference_ta: மல்கியா 3:8 (TAOVBSI)
    text_ta: மனுஷன் தேவனை வஞ்சிக்கலாமா? நீங்களோ என்னை வஞ்சிக்கிறீர்கள். எதிலே உம்மை வஞ்சித்தோம் என்கிறீர்கள்? தசமபாகத்திலும் காணிக்கைகளிலுந்தானே.
  - reference: Malachi 3:10 (NKJV)
    leading_title: Bring the Tithes and Offering
    split_max_length: 500
    text: Bring all the tithes into the storehouse, That there may be food in My house, And try Me now in this," Says the Lord of hosts, "If I will not open for you the windows of heaven And pour out for you such blessing That there will not be room enough to receive it."
    highlights:
    - Bring all the tithes into the storehouse
    - food in My house
    - pour out for you such blessing
    reference_ta: மல்கியா 3:10 (TAOVBSI)
    text_ta: என் ஆலயத்தில் ஆகாரம் உண்டாயிருக்கும்படித் தசமபாகங்களையெல்லாம் பண்டசாலையிலே கொண்டுவாருங்கள்; அப்பொழுது நான் வானத்தின் பலகணிகளைத் திறந்து, இடங்கொள்ளாமற்போகுமட்டும் உங்கள்மேல் ஆசீர்வாதத்தை வருஷிக்கமாட்டேனோவென்று அதினால் என்னைச் சோதித்துப் பாருங்கள் என்று சேனைகளின் கர்த்தர் சொல்லுகிறார்.
    highlights_ta:
    - பண்டசாலையிலே
    - ஆகாரம்
  - reference: Hebrews 11:4 (NKJV)
    leading_title: By Faith Abel Offered
    split_max_length: 500
    text: By faith Abel offered to God a more excellent sacrifice than Cain, through which he obtained witness that he was righteous, God testifying of his gifts; and through it he being dead still speaks.
    highlights:
    - By faith Abel offered
    - a more excellent sacrifice
    - he being dead still speaks
    reference_ta: எபிரெயர் 11:4 (TAOVBSI)
    text_ta: விசுவாசத்தினாலே ஆபேல் காயீனுடைய பலியிலும் மேன்மையான பலியை தேவனுக்குச் செலுத்தினான்; அதினாலே அவன் நீதிமானென்று சாட்சி பெற்றான்; அவனுடைய காணிக்கைகளைக் குறித்துத் தேவனே சாட்சி கொடுத்தார்; அவன் மரித்தும் இன்னும் பேசுகிறான்.
  - reference: Matthew 6:21 (NKJV)
    leading_title: Where Your Treasure Is
    text: For where your treasure is, there your heart will be also.
    highlights:
    - where your treasure is, there your heart will be also
    reference_ta: மத்தேயு 6:21 (TAOVBSI)
    text_ta: உங்கள் பொக்கிஷம் எங்கேயிருக்கிறதோ அங்கே உங்கள் இருதயமும் இருக்கும்.
