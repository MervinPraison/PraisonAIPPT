- section: Romans 10 — whoever believes
  verses:
  - reference: Romans 10:1 (NKJV)
    text: >-
      Brethren, my heart's desire and prayer to God for Israel is that they may
      be saved.
    highlights:
    - text: that they may be saved
      color: green
  - reference: Romans 10:2 (NKJV)
    text: >-
      For I bear them witness that they have a zeal for God, but not according
      to knowledge.
    highlights:
    - text: a zeal for God
      color: '#fde68a'
    - text: not according to knowledge
      color: '#fecaca'
  - reference: Romans 10:3 (NKJV)
    split_max_length: 500
    text: >-
      For they being ignorant of God's righteousness, and seeking to establish
      their own righteousness, have not submitted to the righteousness of God.
    highlights:
    - text: God's righteousness
      color: green
    - text: their own righteousness
      color: '#fecaca'
  - reference: Romans 10:4 (NKJV)
    text: >-
      For Christ is the end of the law for righteousness to everyone who believes.
    highlights:
    - text: Christ is the end of the law
      color: '#fde68a'
    - text: everyone who believes
      color: green
  - reference: Romans 10:5 (NKJV)
    text: >-
      For Moses writes about the righteousness which is of the law, "The man who
      does those things shall live by them."
    highlights:
    - text: the righteousness which is of the law
      color: '#fecaca'
  - reference: Romans 10:6–8 (NKJV)
    split_max_length: 500
    text: >-
      But the righteousness of faith speaks in this way, "Do not say in your
      heart, 'Who will ascend into heaven?'" (that is, to bring Christ down from
      above) or, "'Who will descend into the abyss?'" (that is, to bring Christ
      up from the dead). But what does it say? "The word is near you, in your
      mouth and in your heart" (that is, the word of faith which we preach):
    highlights:
    - text: the righteousness of faith
      color: green
    - text: The word is near you
      color: '#fde68a'
    - text: the word of faith
      color: green
  - reference: Romans 10:9 (NKJV)
    split_max_length: 500
    text: >-
      that if you confess with your mouth the Lord Jesus and believe in your
      heart that God has raised Him from the dead, you will be saved.
    highlights:
    - text: confess with your mouth the Lord Jesus
      color: green
    - text: believe in your heart
      color: green
    - text: you will be saved
      color: '#fde68a'
  - reference: Romans 10:10 (NKJV)
    text: >-
      For with the heart one believes unto righteousness, and with the mouth
