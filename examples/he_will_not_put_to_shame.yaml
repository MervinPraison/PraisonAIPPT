sections:
- section: ''
  verses:
  - reference: Romans 9:33 (NKJV)
    split_max_length: 500
    text: >-
      As it is written: "Behold, I lay in Zion a stumbling stone and rock of
      offense, And whoever believes on Him will not be put to shame."
    highlights:
    - will not be put to shame
  - reference: Romans 10:1 (NKJV)
    text: >-
      Brethren, my heart's desire and prayer to God for Israel is that they may
      be saved.
    highlights:
    - saved
  - reference: Romans 10:11 (NKJV)
    text: >-
      For the Scripture says, "Whoever believes on Him will not be put to shame."
    highlights:
    - will not be put to shame
  - reference: Romans 10:13 (NKJV)
    text: >-
      For "whoever calls on the name of the Lord shall be saved."
    highlights:
    - saved
- section: '1. Sent'
  section_subtitle: How shall they preach unless they are sent
  verses:
  - reference: Romans 10:15 (NKJV)
    split_max_length: 500
    text: >-
      And how shall they preach unless they are sent? As it is written: "How
      beautiful are the feet of those who preach the gospel of peace, Who bring
      glad tidings of good things!"
    highlights:
    - sent
  - reference: Malachi 3:10 (NKJV)
    split_max_length: 500
    text: >-
      Bring all the tithes into the storehouse, That there may be food in My
      house, And try Me now in this," Says the Lord of hosts, "If I will not
      open for you the windows of heaven And pour out for you such blessing That
      there will not be room enough to receive it."
    highlights:
    - storehouse
    - food
- section: '2. Hear'
  section_subtitle: How shall they hear without a preacher
  verses:
  - reference: Romans 10:14 (NKJV)
    split_max_length: 500
    text: >-
      How then shall they call on Him in whom they have not believed? And how
      shall they believe in Him of whom they have not heard? And how shall they
      hear without a preacher?
    highlights:
    - hear without a preacher
- section: '3. See'
  section_subtitle: How shall they believe without being heard
  verses:
  - reference: Romans 10:14 (NKJV)
    split_max_length: 500
    text: >-
      How then shall they call on Him in whom they have not believed? And how
      shall they believe in Him of whom they have not heard? And how shall they
      hear without a preacher?
    highlights:
    - believe in Him of whom they have not heard
  - reference: Ephesians 1:18 (NIV)
    leading_title: Open the eyes of my heart
    split_max_length: 500
    text: >-
      I pray that the eyes of your heart may be enlightened in order that you
      may know the hope to which he has called you, the riches of his glorious
      inheritance in his holy people,
    highlights:
    - the eyes of your heart


- section: '4. Speak'
  section_subtitle: Faith speaks
  verses:
  - reference: Romans 10:6 (NKJV)
    split_max_length: 500
    text: >-
      But the righteousness of faith speaks in this way, "Do not say in your
      heart, 'Who will ascend into heaven?'" (that is, to bring Christ down from
      above)
    highlights:
    - faith speaks
  - reference: Romans 10:8 (NKJV)
    text: >-
      But what does it say? "The word is near you, in your mouth and in your
      heart" (that is, the word of faith which we preach):
    highlights:
    - in your mouth
  - reference: Mark 11:23 (NKJV)
    split_max_length: 500
    text: >-
      For assuredly, I say to you, whoever says to this mountain, 'Be removed
      and be cast into the sea,' and does not doubt in his heart, but believes
      that those things he says will be done, he will have whatever he says.
    highlights:
    - say
    - believe
- section: Hearing
  verses:
  - reference: Romans 10:18 (NKJV)
    split_max_length: 500
    text: >-
      But I say, have they not heard? Yes indeed: "Their sound has gone out to
      all the earth, And their words to the ends of the world."
    highlights:
    - have they not heard
  - reference: Hebrews 4:2 (NKJV)
    split_max_length: 500
    text: >-
      For indeed the gospel was preached to us as well as to them; but the word
      which they heard did not profit them, not being mixed with faith in those
      who heard it.
    highlights:
    - the gospel was preached
    - they heard
  - reference: Hebrews 4:2 (NKJV)
    split_max_length: 500
    text: >-
      For indeed the gospel was preached to us as well as to them; but the word
      which they heard did not profit them, not being mixed with faith in those
      who heard it.
    highlights:
    - not being mixed with faith
