- section: The Parable of the Lost Sheep
  verses:
  - reference: Luke 15:1–2 (NKJV)
    split_max_length: 500
    text: >-
      Then all the tax collectors and sinners drew near to Him to hear Him. And
      the Pharisees and scribes complained, saying, "This Man receives sinners
      and eats with them."
    highlights:
    - sinners
    - receives sinners
  - reference: Luke 15:3–7 (NKJV)
    leading_title: The Parable of the Lost Sheep
    split_max_length: 450
    text: >-
      So He spoke this parable to them, saying: "What man of you, having a
      hundred sheep, if he loses one of them, does not leave the ninety-nine in
      the wilderness, and go after the one which is lost until he finds it? And
      when he has found it, he lays it on his shoulders, rejoicing. And when he
      comes home, he calls together his friends and neighbors, saying to them,
      'Rejoice with me, for I have found my sheep which was lost.' I say to you
      that likewise there will be more joy in heaven over one sinner who repents
      than over ninety-nine just persons who need no repentance."
    highlights:
    - lost
    - rejoicing
    - text: one sinner who repents
      color: green
    - more joy in heaven
