- section: 'Reason — I will'
  section_subtitle: Hebrews 8 and Hebrews 10
  verses:
  - reference: Hebrews 8:8–12 (KJV)
    split_max_length: 480
    text: >-
      For finding fault with them, he saith, Behold, the days come, saith the
      Lord, when I will make a new covenant with the house of Israel and with
      the house of Judah: Not according to the covenant that I made with their
      fathers in the day when I took them by the hand to lead them out of the
      land of Egypt; because they continued not in my covenant, and I regarded
      them not, saith the Lord. For this is the covenant that I will make with
      the house of Israel after those days, saith the Lord; I will put my laws
      into their mind, and write them in their hearts: and I will be to them a
      God, and they shall be to me a people: And they shall not teach every man
      his neighbour, and every man his brother, saying, Know the Lord: for all
      shall know me, from the least to the greatest. For I will be merciful to
      their unrighteousness, and their sins and their iniquities will I remember
      no more.
    highlights:
    - text: I will make a new covenant
      color: green
    - text: I will put my laws
      color: green
    - text: I will be to them a God
      color: green
    - text: I will be merciful
      color: green
    - will I remember no more
  - reference: Hebrews 10:11–14 (KJV)
    split_max_length: 500
    text: >-
      And every priest standeth daily ministering and offering oftentimes the
      same sacrifices, which can never take away sins: But this man, after he
      had offered one sacrifice for sins for ever, sat down on the right hand of
      God; From henceforth expecting till his enemies be made his footstool. For
      by one offering he hath perfected for ever them that are sanctified.
    highlights:
