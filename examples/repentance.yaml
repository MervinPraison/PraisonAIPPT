      water it? So ought not this woman, being a daughter of Abraham, whom Satan
      has bound—think of it—for eighteen years, be loosed from this bond on the
      Sabbath?"
    highlights:
    - daughter of Abraham
    - be loosed from this bond
    - on the Sabbath
  - slide_type: comparison
    reference: Word study
    columns:
    - heading: רָפָא — rapha
